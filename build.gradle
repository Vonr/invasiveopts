plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

repositories {
    exclusiveContent {
        forRepository {
            maven {
                url "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    exclusiveContent {
        forRepository {
            maven { url "https://maven.bawnorton.com/releases" }
        }
        filter {
            includeGroup "com.github.bawnorton.mixinsquared"
        }
    }

    maven {
        // Shadows
        url "https://maven.shadowsoffire.dev/releases"
        content {
            includeGroup "dev.shadowsoffire"
            includeGroup "snownee.jade"
        }
    }

    maven { url 'https://modmaven.dev/' }

    maven { url 'https://maven.fallenbreath.me/releases' }

    maven { url 'https://maven.blamejared.com' }

    maven { url "https://maven.createmod.net" }

    maven { url "https://mvn.devos.one/snapshots" }

    maven { url "https://maven.wispforest.io/releases" }

    maven { url "https://maven.su5ed.dev/releases" }

    maven { url "https://maven.fabricmc.net" }

    maven { url "https://maven.shedaniel.me/" }

    mavenLocal()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    accessTransformers {
        file 'src/main/resources/META-INF/accesstransformer.cfg'
    }

    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }


dependencies {
    //noinspection DependencyNotationArgument
    jarJar(implementation(group:"me.fallenbreath", name:"conditional-mixin-neoforge")) {
        version {
            prefer "${conditional_mixin_version}"
            strictly "[${conditional_mixin_version},)"
        }
    }

    compileOnly(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:${mixin_squared_version}"))
    //noinspection DependencyNotationArgument
    implementation(jarJar("com.github.bawnorton.mixinsquared:mixinsquared-neoforge:${mixin_squared_version}")) {
        version {
            prefer "${mixin_squared_version}"
            strictly "[${mixin_squared_version},)"
        }
    }

    implementation "net.darkhax.botanypots:botanypots-neoforge-1.21.1:${botanypots_version}"
    implementation "net.darkhax.bookshelf:bookshelf-neoforge-1.21.1:${bookshelf_version}"

    compileOnly "mekanism:Mekanism:${mekanism_version}:api"

    implementation "maven.modrinth:pipez:${pipez_version}"

    implementation "curse.maven:xycraft-653786:${xycraft_core_version}"
    implementation "curse.maven:xycraft-world-653789:${xycraft_world_version}"
    implementation "curse.maven:xycraft-machines-653791:${xycraft_machines_version}"

    // too many dependencies to bother adding for `implementation`
    compileOnly "maven.modrinth:pastel:${project.pastel_version}"

    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    implementation("io.wispforest:accessories-neoforge:${accessories_version}")
    implementation("org.sinytra.forgified-fabric-api:fabric-api-base:0.4.42+d1308dedd1") { exclude group: "fabric-api" }

    implementation("org.appliedenergistics:appliedenergistics2:${project.ae2_version}")
    compileOnly("org.appliedenergistics:appliedenergistics2:${project.ae2_version}:api")

    implementation("dev.shadowsoffire:Placebo:1.21.1-${project.placebo_version}")

    implementation("curse.maven:super-factory-manager-306935:${project.sfm_version}")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             neo_version            : neo_version,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    var props = new Properties()
    file(GRADLE_PROPERTIES).withInputStream { props.load(it) }
    for (var p : props) {
        if (p.key instanceof String && p.value instanceof String) {
            var k = (String) p.key
            var v = (String) p.value
            if (k.endsWith("_version_range")) {
                replaceProperties.put(k, v)
            }
        }
    }

    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
